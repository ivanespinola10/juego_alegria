name: myapp
description: "El Mundo de Alegría - Premium Coloring Book"
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  in_app_purchase: ^3.2.0
  in_app_review: ^2.0.12
  floodfill_image: ^0.0.8
  path_provider: ^2.1.6
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.5
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.11.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/vacio.txt
    - assets/audio/
    - assets/Abecedario_MundoAlegria/
    - assets/Animalitos/
    - assets/capibara/
    - assets/Dino/
    - assets/Dinobebe/